server:
  port: 8088

spring:
  application:
    name: campus-knowledge-mvp
  server:
    error:
      include-message: always
      include-binding-errors: always
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_knowledge_mvp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 20180710
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 5s
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        missing-queues-fatal: false
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: campus-secret-campus-secret-123456
  expire-hours: 48

campus:
  rag:
    enabled: false
    top-k: 5
    index-batch-size: 100
    pgvector:
      jdbc-url: jdbc:postgresql://127.0.0.1:5432/campus_rag
      username: postgres
      password: postgres
      schema-name: public
      table-name: campus_post_vectors
      dimensions: 1536
